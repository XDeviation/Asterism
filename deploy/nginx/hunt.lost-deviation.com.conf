server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hunt.lost-deviation.com;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/hunt.lost-deviation.com/rsa-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hunt.lost-deviation.com/rsa-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HuntSSLCompat:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/hunt.access.log;
    error_log /var/log/nginx/hunt.error.log info;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Excalidraw embeds newly uploaded images in canvas save requests.
    client_max_body_size 25m;

    location = /_asterism_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        auth_request /_asterism_auth;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hunt_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /api/auth/login {
        limit_req zone=hunt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hunt_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_conn hunt_connections 100;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hunt_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
